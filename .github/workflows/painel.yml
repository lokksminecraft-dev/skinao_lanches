name: APK Skinao Lanches - Painel

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Criar o app do painel do zero
        run: |
          mkdir app && cd app && mkdir www
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/local-notifications@6 sharp

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.skinao.painel",
            "appName": "Painel Skinão",
            "webDir": "www"
          }
          EOF

          # ===== COLE AQUI OS MESMOS DADOS DO FIREBASE DO APP DO CLIENTE =====
