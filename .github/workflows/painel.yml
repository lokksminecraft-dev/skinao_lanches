          cat > icons.js <<'EOF'
          const sharp=require('sharp'),fs=require('fs'),path=require('path');
          const res='android/app/src/main/res',src='www/logo.jpg';
          const walk=p=>fs.readdirSync(p,{withFileTypes:true}).flatMap(e=>e.isDirectory()?walk(path.join(p,e.name)):[path.join(p,e.name)]);
          (async()=>{
            const sizes={mdpi:48,hdpi:72,xhdpi:96,xxhdpi:144,xxxhdpi:192};
            for(const [d,s] of Object.entries(sizes)){
              const dir=path.join(res,'mipmap-'+d);
              if(!fs.existsSync(dir))continue;
              for(const n of ['ic_launcher','ic_launcher_round'])
                await sharp(src).resize(s,s).png().toFile(path.join(dir,n+'.png'));
            }
            fs.rmSync(path.join(res,'mipmap-anydpi-v26'),{recursive:true,force:true});
            for(const f of walk(res).filter(f=>path.basename(f)==='splash.png')){
              const m=await sharp(f).metadata(),l=Math.round(Math.min(m.width,m.height)*.45);
              const logo=await sharp(src).resize(l,l).png().toBuffer();
              await sharp({create:{width:m.width,height:m.height,channels:3,background:'#0d0604'}}).composite([{input:logo,gravity:'center'}]).png().toFile(f+'.tmp');
              fs.renameSync(f+'.tmp',f);
            }
            console.log('icones e splash ok');
          })();
          EOF

          cat > www/index.html <<'EOF'
          <!doctype html>
          <html lang="pt-BR"><head><meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
          <meta name="theme-color" content="#120807">
          <title>Painel Skinão</title>
          <style>
          *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
          :root{color-scheme:dark;--bg:#120807;--fg:#fff4e8;--card:#2a1310cc;--ac:#ff7a1a;--ac2:#ffc247;--mu:#cdaa90;--bd:#4d2618;--btn:linear-gradient(135deg,#c93f08,#f26a0f);--sh:0 8px 24px #f26a0f26}
          html,body{margin:0}
          body{background:var(--bg);color:var(--fg);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;overflow-x:hidden}
          .blob{position:fixed;width:280px;height:280px;border-radius:50%;filter:blur(70px);opacity:.35;z-index:0;animation:float 12s ease-in-out infinite;pointer-events:none}
          .b1{background:var(--ac);top:-80px;right:-80px}.b2{background:#8a2a12;bottom:80px;left:-120px;animation-delay:-6s}
          @keyframes float{50%{transform:translate(30px,40px) scale(1.15)}}
          .hero{position:relative;z-index:1;display:flex;align-items:center;gap:14px;padding:calc(22px + env(safe-area-inset-top)) 20px 26px;color:#fff;background:linear-gradient(135deg,#4a120c,#9a3a0c 55%,#e8821e);border-radius:0 0 32px 32px;box-shadow:var(--sh);animation:drop .7s cubic-bezier(.2,.9,.3,1.2) both}
          @keyframes drop{from{transform:translateY(-100%);opacity:0}}
          .logo{width:84px;height:84px;flex:none;border-radius:50%;object-fit:cover;box-shadow:0 0 0 3px #ffffff45,0 0 28px #ffa726aa;animation:wob 3s ease-in-out infinite}
          @keyframes wob{50%{transform:rotate(-8deg) scale(1.08)}}
          .ht{min-width:0}.hero h1{margin:0;font-size:27px;font-weight:900;letter-spacing:-.5px;text-shadow:0 2px 0 #0005}.hero p{margin:2px 0 0;opacity:.95;font-size:14px;font-weight:600}.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.chips a{color:#fff;text-decoration:none;font-size:12px;font-weight:700;padding:5px 11px;border-radius:20px;background:#00000050;backdrop-filter:blur(6px)}
          #nt,#view{position:relative;z-index:1;max-width:640px;margin:0 auto;padding:0 16px}
          .notice{display:flex;gap:10px;align-items:center;margin:16px 0 0;padding:12px 14px;border-radius:16px;background:var(--card);border:1px solid var(--bd);backdrop-filter:blur(10px);font-weight:600;animation:rise .5s .3s both}
          .notice span{animation:ring 2s infinite}@keyframes ring{0%,60%,100%{transform:rotate(0)}70%{transform:rotate(18deg)}80%{transform:rotate(-14deg)}90%{transform:rotate(8deg)}}
          #view{padding-top:8px;padding-bottom:calc(170px + env(safe-area-inset-bottom))}
          .sec{font-size:13px;letter-spacing:1.5px;text-transform:uppercase;color:var(--mu);margin:20px 4px 4px;font-weight:700}
          .card{position:relative;display:flex;align-items:center;gap:12px;margin:12px 0;padding:14px;border-radius:22px;background:var(--card);border:1px solid var(--bd);backdrop-filter:blur(12px);box-shadow:var(--sh);transition:transform .25s,box-shadow .25s,border-color .25s}
          .in{animation:rise .55s var(--d,0ms) cubic-bezier(.2,.8,.2,1) both}
          @keyframes rise{from{opacity:0;transform:translateY(24px) scale(.97)}}
          .card.sel{border-color:var(--ac);transform:scale(1.015)}
          .emo{font-size:34px;width:62px;height:62px;flex:none;border-radius:18px;display:grid;place-items:center;background:linear-gradient(135deg,#f26a0f33,#ffc24722)}
          .inf{flex:1;min-width:0}.inf b{font-size:17px}.inf .d{color:var(--mu);font-size:13px;margin:2px 0 6px}
          .price{font-weight:800;font-size:17px;background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent}
          .qty{display:flex;align-items:center;gap:6px;background:var(--bg);border-radius:30px;padding:4px;border:1px solid var(--bd)}
          .qty button{width:34px;height:34px;border-radius:50%;border:0;font-size:20px;font-weight:700;color:#fff;background:var(--btn);transition:transform .15s}
          .qty button:active{transform:scale(.8)}.qty .m{background:var(--card);color:var(--fg);border:1px solid var(--bd)}
          .qty b{min-width:20px;text-align:center}.pop{animation:pop .3s}@keyframes pop{50%{transform:scale(1.5)}}
          .pcard{background:linear-gradient(135deg,#f26a0f22,#ffc24718),var(--card)}
          .tag{display:inline-block;font-size:12px;font-weight:700;color:#fff;padding:3px 10px;border-radius:20px;background:var(--btn);margin-bottom:6px}
          .empty{text-align:center;padding:50px 20px;color:var(--mu)}.empty div{font-size:64px;animation:float 5s ease-in-out infinite}
          .sk{height:92px;border-radius:22px;margin:12px 0;background:linear-gradient(90deg,var(--card) 25%,var(--bd) 50%,var(--card) 75%);background-size:200% 100%;animation:sh 1.2s infinite}@keyframes sh{to{background-position:-200% 0}}
          nav{position:fixed;z-index:5;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));max-width:616px;margin:0 auto;display:flex;padding:6px;border-radius:26px;background:var(--card);backdrop-filter:blur(18px);border:1px solid var(--bd);box-shadow:0 10px 30px #0003}
          nav button{flex:1;border:0;background:none;color:var(--mu);padding:8px 0;border-radius:20px;display:flex;flex-direction:column;align-items:center;gap:1px;transition:all .3s}
          nav button span{font-size:22px;transition:transform .3s}nav small{font-size:11px;font-weight:600}
          nav button.on{color:#fff;background:var(--btn);box-shadow:var(--sh)}nav button.on span{transform:translateY(-2px) scale(1.15)}
          .bar{position:fixed;z-index:6;left:16px;right:16px;max-width:608px;margin:0 auto;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateY(calc(100% + 160px));opacity:0;pointer-events:none;transition:transform .45s cubic-bezier(.2,.9,.3,1.2),opacity .3s}.bar.show{transform:none;opacity:1;pointer-events:auto}
          .bar button{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;border:0;color:#fff;font-size:16px;padding:14px 18px;border-radius:22px;background:var(--btn);box-shadow:0 12px 30px #f26a0f66}
          .cnt{background:#fff;color:var(--ac);width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:800}
          #sheet{position:fixed;inset:0;z-index:10;display:none;align-items:flex-end;background:#0007;backdrop-filter:blur(4px)}
          #sheet.show{display:flex;animation:fade .3s}@keyframes fade{from{opacity:0}}
          .pane{width:100%;max-width:640px;margin:0 auto;background:var(--bg);border-radius:30px 30px 0 0;padding:20px 20px calc(24px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto;animation:up .45s cubic-bezier(.2,.9,.3,1.1)}@keyframes up{from{transform:translateY(100%)}}
          .grip{width:44px;height:5px;border-radius:5px;background:var(--bd);margin:0 auto 14px}
          .pane h2{margin:0 0 10px}.ln{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed var(--bd)}
          .tot{display:flex;justify-content:space-between;font-size:20px;font-weight:800;margin:14px 0}
          .pane input,.pane textarea{width:100%;font:inherit;color:var(--fg);background:var(--card);border:1.5px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:10px;outline:0;transition:border-color .2s}
          .pane input:focus,.pane textarea:focus{border-color:var(--ac)}
          .send{width:100%;border:0;color:#fff;font-weight:700;font-size:17px;font-family:inherit;padding:15px;border-radius:18px;background:var(--btn);box-shadow:0 10px 26px #f26a0f66}.send:active{transform:scale(.97)}
          .ok{text-align:center;padding:20px 0}.ok .big{font-size:76px;animation:pop .6s}.ok h2{margin:8px 0}
          .cf{position:fixed;top:40%;left:50%;width:10px;height:14px;z-index:20;border-radius:3px;pointer-events:none;animation:cf 1.3s ease-out forwards}
          @keyframes cf{to{transform:translate(var(--x),var(--y)) rotate(var(--r));opacity:0}}
          @media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important;transition-duration:.01s!important}}

          .d{color:var(--mu);font-size:13px}.card.ed{display:block}.rw{display:flex;gap:8px;margin-bottom:8px}.rw:last-child{margin-bottom:0}.rw input,.rw select{min-width:0;flex:1}
          input,select{font:inherit;color:var(--fg);background:var(--bg);border:1.5px solid var(--bd);border-radius:12px;padding:10px;outline:0;width:100%;color-scheme:dark}input:focus,select:focus{border-color:var(--ac)}
          .rw .em{flex:0 0 58px;text-align:center;font-size:22px;padding:6px}.rw .pr{flex:0 0 100px}
          .x{flex:0 0 42px;border:0;border-radius:12px;background:#ef444433;color:#fca5a5;font-size:16px}.x:active{transform:scale(.9)}
          .btn{border:0;color:#fff;font-weight:700;font-size:14px;font-family:inherit;padding:9px 14px;border-radius:14px;background:var(--btn);box-shadow:0 6px 16px #f26a0f44}.btn:active{transform:scale(.95)}
          .ghost{border:1.5px solid var(--bd);background:none;color:var(--fg);font-weight:700;font-size:14px;font-family:inherit;padding:8px 14px;border-radius:14px}
          .wide{width:100%;margin-top:6px;padding:14px;font-size:15px}
          .stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stats .card{margin:12px 0 0}.stats b{font-size:24px}
          .fl{display:flex;gap:8px;overflow-x:auto;margin:16px 0 4px}.fc{flex:none;border:1.5px solid var(--bd);background:var(--card);color:var(--fg);padding:7px 14px;border-radius:20px;font-weight:700;font-size:13px;font-family:inherit}.fc.on{background:var(--btn);border-color:transparent;color:#fff}
          .st{font-size:11px;font-weight:800;padding:3px 9px;border-radius:20px;margin-left:6px;color:#fff}.s-novo{background:var(--btn)}.s-pronto{background:#16a34a}.s-entregue{background:#52525b}
          .ic{position:relative;display:inline-block}.bd{position:absolute;top:-6px;right:-13px;font-style:normal;font-size:11px;font-weight:800;background:#fff;color:#c93f08;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 4px}
          .out{margin-left:auto;background:#0005;color:#fff;border:0;padding:8px 14px;border-radius:14px;font-weight:700;font-family:inherit}
          .bar button small{opacity:.9;font-weight:600}
          #login{position:fixed;inset:0;z-index:30;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;background:var(--bg);text-align:center}#login.show{display:flex}
          #login>*{width:100%;max-width:340px;margin-top:0;margin-bottom:0}#login .logo{width:120px;height:120px}#login h2{margin:0}#er{color:#fca5a5;font-size:14px;min-height:20px}
          #toast{position:fixed;z-index:40;left:16px;right:16px;max-width:560px;margin:0 auto;top:calc(14px + env(safe-area-inset-top));padding:14px 16px;border-radius:18px;background:#16a34a;color:#fff;font-weight:700;box-shadow:0 10px 30px #0006;transform:translateY(-200%);transition:transform .4s cubic-bezier(.2,.9,.3,1.2)}#toast.show{transform:none}

          .hero{overflow:hidden}.hero>*{position:relative;z-index:1}.hero>.fx{position:absolute;z-index:0}
          .hero::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,#ffffff26,transparent);transform:skewX(-20deg);animation:shine 5s 1s infinite;z-index:0}@keyframes shine{to{left:140%}}
          .fx{bottom:-40px;font-size:26px;opacity:.25;animation:fx 9s linear infinite}
          .fx:nth-of-type(1){left:6%}.fx:nth-of-type(2){left:34%;animation-delay:-3s}.fx:nth-of-type(3){left:62%;animation-delay:-6s}.fx:nth-of-type(4){left:86%;animation-delay:-1.5s}
          @keyframes fx{to{transform:translateY(-200px) rotate(360deg);opacity:0}}
          .lw{position:relative;flex:none;width:94px;height:94px;display:grid;place-items:center}
          .lw::before{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(#ffd166,#f26a0f,#c93f08,#ffd166);animation:spin 3.5s linear infinite}
          .lw .logo{position:relative;border:3px solid #120807;box-shadow:0 0 26px #ffa726aa}@keyframes spin{to{transform:rotate(360deg)}}
          .sec::before{content:"";display:inline-block;width:18px;height:3px;border-radius:3px;background:var(--btn);margin-right:8px;vertical-align:middle}
          .card:active{transform:scale(.985)}button{transition:transform .15s}
          .add{width:44px;height:44px;border-radius:50%;border:0;color:#fff;font-size:24px;font-weight:700;background:var(--btn);box-shadow:0 6px 16px #f26a0f66;animation:pop .35s}.qc{flex:none}
          .plus{position:absolute;right:30px;top:8px;font-style:normal;font-weight:800;color:var(--ac2);animation:plus .7s forwards;pointer-events:none}@keyframes plus{to{transform:translateY(-34px);opacity:0}}
          .bar button{animation:bumpb .4s,glow 2.2s .4s infinite}@keyframes bumpb{40%{transform:scale(1.06)}}@keyframes glow{50%{box-shadow:0 12px 42px #f26a0fbb}}
          .seg{display:flex;gap:6px;background:var(--card);padding:5px;border-radius:16px;margin-bottom:12px;border:1px solid var(--bd)}
          .seg button{flex:1;border:0;background:none;color:var(--mu);font-weight:700;font-family:inherit;font-size:15px;padding:10px;border-radius:12px;transition:all .3s}.seg button.on{background:var(--btn);color:#fff;box-shadow:0 6px 16px #f26a0f55}
          .shake{animation:shake .4s}@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
          .ck{width:92px;height:92px;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.ck circle{stroke:#22c55e;stroke-dasharray:151;stroke-dashoffset:151;animation:dash .6s forwards}.ck path{stroke:#22c55e;stroke-dasharray:40;stroke-dashoffset:40;animation:dash .4s .5s forwards}@keyframes dash{to{stroke-dashoffset:0}}
          .ok .big{display:grid;place-items:center}

          .acts{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 0}.acts a{color:var(--fg);text-decoration:none;font-weight:700;font-size:13px;padding:8px 13px;border-radius:14px;border:1.5px solid var(--bd);background:var(--bg);transition:transform .15s}.acts a:active{transform:scale(.93)}.acts a.wa{background:linear-gradient(135deg,#15803d,#22c55e);border-color:transparent;color:#fff}
          .card.ed.so-novo{border-left:4px solid var(--ac)}.card.ed.so-pronto{border-left:4px solid #22c55e}.card.ed.so-entregue{border-left:4px solid #52525b;opacity:.85}
          .card.new{animation:flash 1.4s 3}@keyframes flash{50%{box-shadow:0 0 0 3px var(--ac2),0 0 32px #ffa726aa}}
          .bd{animation:pulse 1.4s infinite}@keyframes pulse{50%{transform:scale(1.25)}}.ed .d{white-space:pre-line}
          </style></head>
          <body>
          <div class="blob b1"></div><div class="blob b2"></div>
          <header class="hero"><span class="fx">🍔</span><span class="fx">🍟</span><span class="fx">🥤</span><span class="fx">🌭</span><div class="lw"><img class="logo" src="logo.jpg" alt="Skinão Lanches"></div><div class="ht"><h1>Painel</h1><p>Skinão Lanches · gestão</p></div><button class="out" onclick="auth&&auth.signOut()">Sair</button></header>
          <div id="view"></div><div id="bar" class="bar"></div><nav id="nav"></nav><div id="toast"></div>
          <div id="login"><img class="logo" src="logo.jpg" alt=""><h2>Painel Skinão Lanches</h2><p class="d">Acesso do dono</p><input id="em" type="email" placeholder="E-mail" autocomplete="username"><input id="pw" type="password" placeholder="Senha" autocomplete="current-password"><button class="send" onclick="doLogin()">Entrar</button><p id="er"></p></div>
          <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
          <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
          <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
          <script src="firebase-config.js"></script>
          <script>
          const $=s=>document.querySelector(s);
          const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
          const money=n=>'R$ '+Number(n||0).toFixed(2).replace('.',',');
          const ok=typeof firebase!=='undefined'&&FIREBASE_CONFIG.apiKey!=='COLE_AQUI';
          let auth=null,db=null;
          if(ok){firebase.initializeApp(FIREBASE_CONFIG);auth=firebase.auth();db=firebase.firestore()}
          let d=null,orders=[],tab='ord',filt='novo',first=true,dirty=false,anim=true,unsub=[];
          const TABS=[['ord','📦','Pedidos'],['menu','🍔','Cardápio'],['div','📢','Divulgação'],['dat','🎉','Datas']];
          const LBL={novo:'Novo',pronto:'Pronto',entregue:'Entregue'};
          const fresh=new Set();
          const digits=s=>String(s||'').replace(/\D/g,''),full=p=>p.length<=11?'55'+p:p;
          const fmtP=p=>{p=digits(p);return p.length===11?`(${p.slice(0,2)}) ${p.slice(2,7)}-${p.slice(7)}`:p.length===10?`(${p.slice(0,2)}) ${p.slice(2,6)}-${p.slice(6)}`:p};
          function waLink(o){const n=(o.name||'').split(' ')[0],r=(o.lines||[]).map(l=>l.q+'× '+l.n).join(', ');
           const t=o.status==='pronto'?(o.mode==='retirada'?`Olá, ${n}! Seu pedido está pronto para retirada na Skinão Lanches 🍔`:`Olá, ${n}! Seu pedido está pronto e já vai sair para entrega 🛵`):o.status==='entregue'?`Obrigado pelo pedido, ${n}! Volte sempre à Skinão Lanches 🧡`:`Olá, ${n}! Recebemos seu pedido na Skinão Lanches 🍔 (${r}), total ${money(o.total)}. Já estamos preparando!`;
           return 'https://wa.me/'+full(digits(o.phone))+'?text='+encodeURIComponent(t)}
          function oc(o,i,c){const has=digits(o.phone).length>=10,ent=o.mode!=='retirada';
           return `<div class="card ed so-${o.status} ${c} ${fresh.has(o.id)?'new':''}" style="--d:${i*60}ms"><div class="rw" style="justify-content:space-between;align-items:center"><b>${esc(o.name)}</b><span class="price">${money(o.total)}</span></div>
           <div>${(o.lines||[]).map(l=>l.q+'× '+esc(l.n)).join(' · ')}</div>
           ${o.mode?`<div class="d" style="margin-top:6px">${ent?'🛵 Entrega':'🏪 Retirada no balcão'}</div>`:''}
           ${ent&&o.address?`<div class="d">📍 ${esc(o.address)}</div>`:''}
           ${has?`<div class="d">📞 ${fmtP(o.phone)}</div>`:''}
           ${o.obs?`<div class="d">📝 ${esc(o.obs)}</div>`:''}
           ${has?`<div class="acts"><a class="wa" href="${waLink(o)}">💬 WhatsApp</a><a href="tel:+${full(digits(o.phone))}">📞 Ligar</a>${ent&&o.address?`<a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(o.address)}">🗺️ Mapa</a>`:''}</div>`:''}
           <div class="rw" style="margin:10px 0 0;align-items:center;justify-content:space-between"><span class="d">${when(o.at)}<span class="st s-${o.status}">${LBL[o.status]||o.status}</span></span>${act(o)}</div></div>`}
          function cu(e,go){const n=+e.dataset.n,m=e.dataset.m,f=v=>m?money(v):Math.round(v);if(!go){e.textContent=f(n);return}let s=null;const st=t=>{s=s||t;const k=Math.min(1,(t-s)/700);e.textContent=f(n*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(st)};requestAnimationFrame(st)}
          const when=t=>new Date(t).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
          const isNative=!!(window.Capacitor&&Capacitor.isNativePlatform&&Capacitor.isNativePlatform());
          let LN=null,perm='unknown';
          if(isNative){try{LN=Capacitor.registerPlugin('LocalNotifications');LN.addListener('localNotificationActionPerformed',()=>go('ord'))}catch(e){}}
          async function initNotif(ask){
           if(!LN)return;
           try{
            let p=await LN.checkPermissions();
            if(p.display!=='granted'&&ask)p=await LN.requestPermissions();
            perm=p.display;
            if(perm==='granted')await LN.createChannel({id:'pedidos',name:'Novos pedidos',description:'Aviso quando um cliente faz um pedido',importance:5,visibility:1,vibration:true,lights:true});
           }catch(e){}
           if(tab==='ord')view();
          }
          async function notify(title,body){
           if(!LN||perm!=='granted')return;
           try{await LN.schedule({notifications:[{id:Math.floor(Date.now()/1000)%2000000000,title,body,channelId:'pedidos'}]})}catch(e){}
          }
          function testNotif(){notify('🍔 Teste de aviso','Está funcionando! 🎉')}
          function notifCard(c){
           if(!isNative)return '';
           const on=perm==='granted';
           const t=on?'Avisos de novos pedidos ativados':perm==='denied'?'Avisos bloqueados: ative em Configurações do celular > Apps > Painel Skinão > Notificações':'Avisos de novos pedidos desativados';
           return `<div class="card ed ${c}"><div class="rw" style="align-items:center;justify-content:space-between"><span class="d">🔔 ${t}</span>${on?'<button class="ghost" onclick="testNotif()">Testar</button>':'<button class="btn" onclick="initNotif(true)">Ativar</button>'}</div></div>`}
          function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3200)}
          function nav(){const n=orders.filter(o=>o.status==='novo').length;$('#nav').innerHTML=TABS.map(([k,i,l])=>`<button class="${tab===k?'on':''}" onclick="go('${k}')"><span class="ic">${i}${k==='ord'&&n?`<i class="bd">${n}</i>`:''}</span><small>${l}</small></button>`).join('')}
          function go(k){tab=k;anim=true;nav();view();bar()}
          const E=(p,i,f,v,ph,x)=>`<input ${x||''} value="${esc(v)}" placeholder="${ph}" oninput="ed('${p}',${i},'${f}',this.value)">`;
          function ed(p,i,f,v){if(p==='cfg')d[f]=v;else d[p][i][f]=f==='price'?(parseFloat(String(v).replace(',','.'))||0):v;dirty=true;bar()}
          function addI(p,o){d[p].push(o);dirty=true;view();bar()}
          function delI(p,i){if(!confirm('Remover este item?'))return;d[p].splice(i,1);dirty=true;view();bar()}
          function bar(){const b=$('#bar');b.classList.toggle('show',dirty&&tab!=='ord');b.innerHTML='<button onclick="save()"><span>💾 Salvar alterações</span><small>vai para o app dos clientes</small></button>'}
          function act(o){return o.status==='novo'?`<button class="btn" onclick="setSt('${o.id}','pronto')">Marcar pronto</button>`:o.status==='pronto'?`<button class="btn" onclick="setSt('${o.id}','entregue')">Entregue ✓</button>`:`<button class="ghost" onclick="setSt('${o.id}','novo')">Reabrir</button>`}
          function setSt(id,s){db.doc('orders/'+id).update({status:s}).catch(()=>toast('Não foi possível atualizar o pedido.'))}
          function view(){
           const c=anim?'in':'',D=i=>`style="--d:${i*60}ms"`;let h='';
           if(tab==='ord'){
            const t0=new Date(new Date().toDateString()).getTime(),td=orders.filter(o=>o.at>=t0);
            h=notifCard(c)+`<div class="stats"><div class="card ed ${c}"><div class="d">Pedidos hoje</div><b data-n="${td.length}">0</b></div><div class="card ed ${c}"><div class="d">Faturamento hoje</div><b class="price" data-n="${td.reduce((s,o)=>s+(o.total||0),0)}" data-m="1">R$ 0,00</b></div></div>`;
            h+='<div class="fl">'+[['novo','Novos'],['pronto','Prontos'],['entregue','Entregues'],['all','Todos']].map(([k,l])=>`<button class="fc ${filt===k?'on':''}" onclick="filt='${k}';anim=true;view()">${l} (${k==='all'?orders.length:orders.filter(o=>o.status===k).length})</button>`).join('')+'</div>';
            const L=orders.filter(o=>filt==='all'||o.status===filt);
            h+=L.length?L.map((o,i)=>oc(o,i,c)).join(''):'<div class="empty"><div>📭</div><p>Nenhum pedido aqui.</p></div>';
           }else if(!d){h='<div class="sk"></div><div class="sk"></div>'}
           else if(tab==='menu'){
            h='<div class="sec">Itens e preços</div><p class="d" style="margin:0 4px">O emoji é opcional: se ficar vazio, o app escolhe pelo nome.</p>'+d.items.map((it,i)=>`<div class="card ed ${c}" ${D(i)}><div class="rw">${E('items',i,'emoji',it.emoji||'','🍔','class="em"')}${E('items',i,'name',it.name,'Nome do item')}<button class="x" onclick="delI('items',${i})">✕</button></div><div class="rw">${E('items',i,'price',it.price,'Preço','class="pr" inputmode="decimal"')}${E('items',i,'desc',it.desc,'Descrição')}</div></div>`).join('')+`<button class="btn wide" onclick="addI('items',{name:'',price:0,desc:'',emoji:''})">＋ Adicionar item</button>`;
           }else if(tab==='div'){
            const L=p=>d[p].map((n,i)=>`<div class="card ed ${c}"><div class="rw">${E(p,i,'title',n.title,'Título')}<button class="x" onclick="delI('${p}',${i})">✕</button></div><div class="rw">${E(p,i,'text',n.text,'Texto')}</div></div>`).join('');
            h=`<div class="sec">Geral</div><div class="card ed ${c}"><div class="rw">${E('cfg',0,'name',d.name,'Nome da lanchonete')}</div><div class="rw">${E('cfg',0,'notice',d.notice,'Aviso no topo do app (vazio = esconder)')}</div></div>
            <div class="sec">Novidades</div>${L('news')}<button class="btn wide" onclick="addI('news',{title:'',text:''})">＋ Nova novidade</button>
            <div class="sec">Promoções</div>${L('promos')}<button class="btn wide" onclick="addI('promos',{title:'',text:''})">＋ Nova promoção</button>`;
           }else{
            h='<div class="sec">Datas especiais e comemorativas</div>'+d.dates.map((n,i)=>`<div class="card ed ${c}" ${D(i)}><div class="rw">${E('dates',i,'label',n.label,'Ex.: Dia do Hambúrguer')}<button class="x" onclick="delI('dates',${i})">✕</button></div><div class="rw"><input type="date" value="${esc(n.date)}" oninput="ed('dates',${i},'date',this.value)"><select onchange="ed('dates',${i},'kind',this.value)"><option value="especial" ${n.kind!=='comemorativa'?'selected':''}>⭐ Especial</option><option value="comemorativa" ${n.kind==='comemorativa'?'selected':''}>🎉 Comemorativa</option></select></div></div>`).join('')+`<button class="btn wide" onclick="addI('dates',{label:'',date:'',kind:'especial'})">＋ Adicionar data</button>`;
           }
           anim=false;$('#view').innerHTML=h;document.querySelectorAll('[data-n]').forEach(e=>cu(e,c==='in'));
          }
          async function save(){
           const c=JSON.parse(JSON.stringify(d));
           c.items=c.items.filter(x=>(x.name||'').trim());c.news=c.news.filter(x=>(x.title||'').trim());c.promos=c.promos.filter(x=>(x.title||'').trim());c.dates=c.dates.filter(x=>(x.label||'').trim()&&x.date);
           try{await db.doc('config/main').set(c);d=c;dirty=false;bar();view();toast('Salvo! O app dos clientes já está atualizado ✓')}
           catch(e){toast('Erro ao salvar. Confira a internet e as regras do Firebase.')}
          }
          async function doLogin(){
           $('#er').textContent='';
           try{await auth.signInWithEmailAndPassword($('#em').value.trim(),$('#pw').value)}catch(e){$('#er').textContent='E-mail ou senha incorretos.'}
          }
          nav();view();bar();
          if(!ok){$('#login').classList.add('show');$('#er').textContent='Cole os dados do Firebase no arquivo (onde está COLE_AQUI).'}
          else auth.onAuthStateChanged(u=>{
           unsub.forEach(f=>f());unsub=[];d=null;first=true;orders=[];
           if(!u){$('#login').classList.add('show');return}
           $('#login').classList.remove('show');initNotif(true);
           db.doc('config/main').get().then(s=>{d=Object.assign({name:'Skinão Lanches',notice:'',items:[],news:[],promos:[],dates:[]},s.exists?s.data():{});['items','news','promos','dates'].forEach(k=>d[k]=d[k]||[]);view()}).catch(()=>toast('Não foi possível carregar as configurações.'));
           unsub.push(db.collection('orders').orderBy('at','desc').limit(100).onSnapshot(s=>{
            if(!first)s.docChanges().forEach(c=>{if(c.type==='added'){fresh.add(c.doc.id);const o=c.doc.data();if(navigator.vibrate)navigator.vibrate([200,100,200]);toast('🔔 Novo pedido!');notify('🍔 Novo pedido!',(o.name||'Cliente')+' · '+money(o.total)+' · '+(o.lines||[]).map(l=>l.q+'× '+l.n).join(', '))}});
            first=false;orders=s.docs.map(x=>Object.assign({id:x.id},x.data()));nav();if(tab==='ord')view();
           },()=>toast('Sem permissão para ler pedidos. Confira as regras do Firebase.')));
           go(tab);
          });
          </script></body></html>
          EOF

      - name: Gerar o projeto Android e compilar
        working-directory: app
        run: |
          npx cap add android
                    sed -i 's#</manifest>#<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/><uses-permission android:name="android.permission.VIBRATE"/></manifest>#' android/app/src/main/AndroidManifest.xml
                    node icons.js
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: apk-skinao-painel
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
